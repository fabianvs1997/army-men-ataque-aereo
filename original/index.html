*{box-sizing:border-box}body{margin:0;background:#19241d;color:#fff;font:16px system-ui}main{position:relative;height:100vh;height:100dvh;overflow:hidden}#flight{width:100%;height:100%;display:block;touch-action:none;outline:none}
