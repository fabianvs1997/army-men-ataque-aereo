<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Army Men: Ataque aéreo (remake)</title>
<style>
:root{--bg:#2f4a22;--fg:#f4f1dc;--accent:#e8c547;--ink:#1e2a14;--panel:rgba(30,42,20,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2b17;--panel:rgba(14,22,10,.86)}}
:root[data-theme="dark"]{--bg:#1d2b17;--panel:rgba(14,22,10,.86)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--panel)}
h1{margin:0;font-family:Impact,"Arial Narrow Bold","Arial Black",sans-serif;font-weight:400;font-size:clamp(40px,12vw,64px);line-height:.95;color:var(--accent);text-shadow:0 4px 0 var(--ink)}
h1 span{display:block;font-size:.55em;color:var(--fg);margin-top:6px}
p{margin:0;max-width:30ch;line-height:1.45;font-size:16px}
button{font:inherit;font-weight:700;font-size:18px;min-height:52px;padding:0 32px;border:0;border-radius:12px;background:var(--accent);color:var(--ink);box-shadow:0 5px 0 #9a7f1c;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #9a7f1c}
#mu{position:absolute;left:12px;bottom:12px;width:44px;min-height:44px;padding:0;font-size:20px;border-radius:50%;background:var(--panel);color:var(--fg);box-shadow:none}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" aria-label="Juego de helicópteros de juguete"></canvas>
<button id="mu" aria-label="Silenciar sonido">🔊</button>
<div id="ov">
<h1 id="ti">ARMY MEN<span>Ataque aéreo</span></h1>
<p id="tx">Arrastra el dedo para pilotar. El disparo es automático. Destruye al ejército beige y recoge cruces para curarte.</p>
<button id="go">Despegar</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cv=$('c'),ctx=cv.getContext('2d'),W=360;
let H=640,sc=1,st='menu',P,B,E,EB,PU,PT,t,score,best=0,spT,scr=0,shake=0,rot=0;
try{best=+localStorage.getItem('amaa-best')||0}catch(e){}
function rs(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;sc=cv.width/W;H=cv.height/sc}
addEventListener('resize',rs);rs();
function reset(){P={x:W/2,y:H-110,tx:W/2,ty:H-110,hp:5,cd:0,inv:0};B=[];E=[];EB=[];PU=[];PT=[];t=0;score=0;spT=1}
reset();
/* audio y vibración */
let AC=null,mute=false,hum=null;
let sil=null;
function silentSrc(){const n=4000,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return 'data:audio/wav;base64,'+btoa(s)}
function audio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0)}catch(e){}}
  if(AC&&AC.state!=='running'){try{AC.resume().catch(()=>{})}catch(e){}}
  if(!sil){try{sil=new Audio(silentSrc());sil.loop=true;const p=sil.play();if(p)p.catch(()=>{})}catch(e){}}
}
function tone(f,f2,d,type,v){if(!AC||mute)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d)}
function noise(d,v,fc){if(!AC||mute)return;const n=AC.currentTime,len=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,len,AC.sampleRate),a=buf.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=buf;fl.type='lowpass';fl.frequency.value=fc;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(fl).connect(g).connect(AC.destination);s.start(n)}
function buzz(p){if(!mute&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}
const sfx={shot(){tone(880,440,.06,'square',.03)},pop(){noise(.15,.18,1800)},boom(){noise(.4,.3,700);tone(120,40,.35,'sawtooth',.12)},hurt(){tone(220,60,.3,'square',.12);noise(.25,.2,900)},heal(){tone(520,520,.08,'triangle',.12);setTimeout(()=>tone(780,780,.12,'triangle',.12),80)},over(){tone(330,60,.9,'sawtooth',.14)}};
function humOn(){if(!AC||hum||mute)return;const o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=52;f.type='lowpass';f.frequency.value=240;g.gain.value=.05;l.frequency.value=13;lg.gain.value=.03;l.connect(lg);lg.connect(g.gain);o.connect(f);f.connect(g);g.connect(AC.destination);o.start();l.start();hum={o,l}}
function humOff(){if(!hum)return;try{hum.o.stop();hum.l.stop()}catch(e){}hum=null}
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊';$('mu').setAttribute('aria-label',mute?'Activar sonido':'Silenciar sonido');if(mute)humOff();else if(st==='play'){audio();humOn()}};
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
/* entrada */
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
let drag=null;
cv.addEventListener('pointerdown',e=>{audio();if(st!=='play')return;humOn();drag={px:e.clientX,py:e.clientY,ox:P.tx,oy:P.ty};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const k=W/cv.getBoundingClientRect().width*1.25;P.tx=drag.ox+(e.clientX-drag.px)*k;P.ty=drag.oy+(e.clientY-drag.py)*k});
cv.addEventListener('pointerup',()=>{drag=null});
cv.addEventListener('pointercancel',()=>{drag=null});
$('go').onclick=()=>{audio();reset();st='play';humOn();buzz(20);tone(300,700,.25,'triangle',.15);$('ov').style.display='none'};
/* lógica */
function boom(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*120;PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.4,c})}}
function spawn(){
  const lv=1+Math.floor(t/25),r=Math.random(),x=30+Math.random()*(W-60);
  if(lv>=3&&r<.2)E.push({k:'h',x,x0:x,y:-30,vy:60,hp:3,r:16,cd:1.2,ph:Math.random()*6,p:50});
  else if(lv>=2&&r<.45)E.push({k:'t',x,y:-30,vy:32,hp:4,r:17,cd:1.5,p:30});
  else E.push({k:'s',x,y:-20,vy:55+lv*4,hp:1,r:9,cd:2+Math.random()*2,p:10});
}
function shoot(e,sp){const a=Math.atan2(P.y-e.y,P.x-e.x);EB.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp})}
function kill(e){score+=e.p;if(e.k==='s')sfx.pop();else{sfx.boom();buzz(30)}boom(e.x,e.y,e.k==='s'?'#d8bd77':'#ff9a2e',e.k==='s'?8:20);if(e.k!=='s')shake=.15;if(Math.random()<.14)PU.push({x:e.x,y:e.y})}
function hurt(){sfx.hurt();buzz([70,40,70]);P.hp--;P.inv=1.3;shake=.3;boom(P.x,P.y,'#7ccf5a',12);if(P.hp<=0)over()}
function over(){
  st='over';humOff();sfx.over();buzz(300);if(score>best){best=score;try{localStorage.setItem('amaa-best',best)}catch(e){}}
  $('ti').innerHTML='Misión fallida';
  $('tx').textContent='Puntos: '+score+'. Récord: '+best+'.';
  $('go').textContent='Reintentar';$('ov').style.display='flex';
}
function upd(dt){
  t+=dt;const sp=260*dt;
  if(keys.arrowleft||keys.a)P.tx-=sp;if(keys.arrowright||keys.d)P.tx+=sp;
  if(keys.arrowup||keys.w)P.ty-=sp;if(keys.arrowdown||keys.s)P.ty+=sp;
  P.tx=clamp(P.tx,20,W-20);P.ty=clamp(P.ty,70,H-40);
  const f=Math.min(1,dt*14);P.x+=(P.tx-P.x)*f;P.y+=(P.ty-P.y)*f;
  P.cd-=dt;P.inv-=dt;shake=Math.max(0,shake-dt);
  if(P.cd<=0){P.cd=.16;sfx.shot();B.push({x:P.x-9,y:P.y-14,vy:-520},{x:P.x+9,y:P.y-14,vy:-520})}
  spT-=dt;if(spT<=0){spawn();spT=Math.max(.4,1.3-t/90)*(.6+Math.random()*.8)}
  for(const b of B){b.y+=b.vy*dt;for(const e of E)if(e.hp>0&&Math.abs(b.x-e.x)<e.r&&Math.abs(b.y-e.y)<e.r+4){e.hp--;e.fl=.08;b.y=-99;if(e.hp<=0)kill(e)}}
  for(const e of E){
    e.y+=e.vy*dt;if(e.fl)e.fl-=dt;if(e.k==='h')e.x=e.x0+Math.sin(t*1.6+e.ph)*60;
    e.cd-=dt;if(e.cd<=0&&e.y>10&&e.y<H*.7&&e.hp>0){shoot(e,e.k==='s'?120:150);e.cd=e.k==='s'?3:e.k==='t'?2:1.4}
    if(e.hp>0&&P.inv<=0&&Math.hypot(e.x-P.x,e.y-P.y)<e.r+10){boom(e.x,e.y,'#ff9a2e',14);e.hp=0;hurt()}
  }
  for(const b of EB){b.x+=b.vx*dt;b.y+=b.vy*dt;if(P.inv<=0&&P.hp>0&&Math.hypot(b.x-P.x,b.y-P.y)<12){b.y=H+99;hurt()}}
  for(const u of PU){u.y+=40*dt;if(Math.hypot(u.x-P.x,u.y-P.y)<20){u.y=H+99;P.hp=Math.min(5,P.hp+1);sfx.heal();buzz(20)}}
  for(const p of PT){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}
  B=B.filter(b=>b.y>-40);E=E.filter(e=>e.hp>0&&e.y<H+40);
  EB=EB.filter(b=>b.y<H+20&&b.y>-20&&b.x>-20&&b.x<W+20);PU=PU.filter(u=>u.y<H+30);PT=PT.filter(p=>p.l>0);
}
/* dibujo */
function heli(x,y,c,d,flip){
  ctx.save();ctx.translate(x,y);if(flip)ctx.scale(1,-1);
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(9,13,11,16,0,0,6.3);ctx.fill();
  ctx.fillStyle=d;ctx.fillRect(-2,12,4,16);ctx.fillRect(-7,25,14,3);ctx.fillRect(-14,-9,3,20);ctx.fillRect(11,-9,3,20);
  ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(0,0,10,15,0,0,6.3);ctx.fill();
  ctx.fillStyle='#a9dbea';ctx.beginPath();ctx.ellipse(0,-6,5,6,0,0,6.3);ctx.fill();
  ctx.rotate(rot);ctx.fillStyle=d;ctx.globalAlpha=.6;ctx.fillRect(-32,-2,64,4);ctx.fillRect(-2,-32,4,64);ctx.globalAlpha=1;
  ctx.restore();
}
function draw(){
  ctx.setTransform(sc,0,0,sc,0,0);
  if(shake>0)ctx.translate((Math.random()-.5)*8*shake*3,(Math.random()-.5)*8*shake*3);
  const base=Math.floor(scr/64),o=scr%64;
  for(let i=-1;i<H/64+1;i++){ctx.fillStyle=((i-base)&1)?'#5b9b3c':'#63a443';ctx.fillRect(-10,i*64+o,W+20,65)}
  ctx.fillStyle='#b58f5a';
  for(let y=-16;y<H+16;y+=16){const wy=y-scr;ctx.fillRect(W/2+Math.sin(wy/90)*70-36,y,72,17)}
  ctx.fillStyle='#e9e2b8';
  for(let i=-1;i<H/64+1;i++){const k=i-base,h=Math.sin(k*91.7)*43758.5,x=(h-Math.floor(h))*W;ctx.beginPath();ctx.arc(x,i*64+o+20,3,0,6.3);ctx.fill()}
  for(const u of PU){const y=u.y+Math.sin(t*5)*2;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(u.x,y,10,0,6.3);ctx.fill();ctx.fillStyle='#d33';ctx.fillRect(u.x-6,y-2,12,4);ctx.fillRect(u.x-2,y-6,4,12)}
  for(const e of E){
    ctx.save();ctx.translate(e.x,e.y);
    if(e.k==='s'){ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(2,7,7,3,0,0,6.3);ctx.fill();ctx.fillStyle=e.fl?'#fff':'#d9bd7a';ctx.fillRect(-3,-4,6,10);ctx.fillRect(3,-5,2,9);ctx.beginPath();ctx.arc(0,-7,3.5,0,6.3);ctx.fill()}
    else if(e.k==='t'){
      ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(-12,-14,32,38);
      ctx.fillStyle='#8a7440';ctx.fillRect(-17,-18,5,36);ctx.fillRect(12,-18,5,36);
      ctx.fillStyle=e.fl?'#fff':'#cfae63';ctx.fillRect(-13,-17,26,34);
      ctx.rotate(Math.atan2(P.y-e.y,P.x-e.x));ctx.fillStyle='#b9983f';ctx.fillRect(0,-2,20,4);ctx.fillStyle=e.fl?'#fff':'#e0c27a';ctx.beginPath();ctx.arc(0,0,8,0,6.3);ctx.fill();
    }
    ctx.restore();
    if(e.k==='h')heli(e.x,e.y,e.fl?'#fff':'#d9bd7a','#8a7440',true);
  }
  ctx.fillStyle='#ffe066';for(const b of B)ctx.fillRect(b.x-1.5,b.y-5,3,10);
  ctx.fillStyle='#ff7a2e';for(const b of EB){ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,6.3);ctx.fill()}
  if(st==='play'&&!(P.inv>0&&Math.floor(t*20)%2))heli(P.x,P.y,'#4c9a3f','#2d5f26',false);
  for(const p of PT){ctx.globalAlpha=clamp(p.l*2.2,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}
  ctx.globalAlpha=1;
  if(st==='play'){
    ctx.font='bold 22px "Trebuchet MS",sans-serif';ctx.textBaseline='top';
    ctx.fillStyle='#e0413a';ctx.strokeStyle='#1e2a14';ctx.lineWidth=3;
    let s='';for(let i=0;i<P.hp;i++)s+='♥';ctx.textAlign='left';ctx.strokeText(s,12,10);ctx.fillText(s,12,10);
    ctx.textAlign='right';ctx.fillStyle='#f4f1dc';const q=String(score);ctx.strokeText(q,W-12,10);ctx.fillText(q,W-12,10);
  }
}
let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1e3);last=n;rot+=dt*28;scr+=dt*(st==='play'?70:35);
  if(st==='play')upd(dt);else{for(const p of PT){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}PT=PT.filter(p=>p.l>0)}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
