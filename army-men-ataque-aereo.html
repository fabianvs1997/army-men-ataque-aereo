<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Army Men: Ataque aéreo 3D</title>
<style>
:root{--bg:#2f4a22;--fg:#f4f1dc;--accent:#e8c547;--ink:#1e2a14;--panel:rgba(30,42,20,.84);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2b17;--panel:rgba(14,22,10,.88)}}
:root[data-theme="dark"]{--bg:#1d2b17;--panel:rgba(14,22,10,.88)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--panel)}
h1{margin:0;font-family:Impact,"Arial Narrow Bold","Arial Black",sans-serif;font-weight:400;font-size:clamp(40px,12vw,64px);line-height:.95;color:var(--accent);text-shadow:0 4px 0 var(--ink)}
h1 span{display:block;font-size:.55em;color:var(--fg);margin-top:6px}
p{margin:0;max-width:32ch;line-height:1.45;font-size:16px}
button{font:inherit;font-weight:700;font-size:18px;min-height:52px;padding:0 32px;border:0;border-radius:12px;background:var(--accent);color:var(--ink);box-shadow:0 5px 0 #9a7f1c;cursor:pointer}
button:active{transform:translateY(3px)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#hud{position:absolute;inset:0;pointer-events:none;display:none;text-shadow:0 2px 0 var(--ink)}
#arm{position:absolute;left:12px;top:12px;width:120px;height:14px;background:rgba(0,0,0,.45);border-radius:7px;overflow:hidden}
#ai{display:block;height:100%;width:100%;background:#e0413a}
#inf{position:absolute;right:12px;top:8px;text-align:right;font-weight:700;line-height:1.3}
#cmp{position:absolute;left:50%;top:40px;margin-left:-16px;width:32px;height:32px;font-size:28px;line-height:32px;text-align:center;color:var(--accent)}
#dg{position:absolute;left:12px;bottom:6px;font-size:12px;opacity:.85}
.b{position:absolute;pointer-events:auto;border-radius:50%;padding:0;min-height:0;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.35);touch-action:none}
#fu{right:16px;bottom:28px;width:92px;height:92px;background:#e0413a;color:#fff}
#pause{left:12px;top:40px;pointer-events:auto;font-size:14px;min-height:36px;padding:0 12px}
#sound{right:12px;top:45px;pointer-events:auto;font-size:14px;min-height:36px;padding:0 12px}
#mi{right:120px;bottom:16px;width:68px;height:68px}

#ov{background:linear-gradient(145deg,rgba(9,23,22,.94),rgba(30,49,30,.82));backdrop-filter:blur(8px)}
h1{letter-spacing:2px;text-shadow:0 3px 0 #182519,0 10px 35px #0008}
#inf{padding:9px 14px;background:#101f22bb;border:1px solid #d8e4b330;border-radius:10px;font-size:13px;letter-spacing:.4px}
#arm{border:2px solid #e7e9cc88;box-shadow:0 2px 12px #0006}#ai{background:linear-gradient(90deg,#d69742,#e5dc83)}
.b{border:2px solid #ffffff45;box-shadow:0 5px 0 #14231c,0 8px 24px #0005}
#fu{background:radial-gradient(circle at 35% 25%,#f47550,#a6302e)}
#pause,#sound{top:62px;background:#152a2cdd;color:#e9e7cc;border:1px solid #ffffff30;box-shadow:none}

/* Separate mobile HUD rows: health/mode, mission, then actions. */
#arm{top:12px;left:12px;width:108px;height:12px}
#inf{top:36px;left:12px;right:12px;text-align:center;font-size:12px;padding:7px 8px}
#pause,#sound{position:absolute;top:76px;min-height:38px;font-size:13px;padding:0 12px}
#pause{left:12px;right:auto}#sound{right:12px;left:auto}
#cmp{top:79px;font-size:25px}
#renderMode{position:absolute;right:12px;top:12px;font-size:11px;color:#fff6cf;background:#14261dcc;border-radius:5px;padding:2px 6px;max-width:calc(100% - 150px);text-align:right}
</style>
</head>
<body>
<div id="wrap">
<canvas id="world3d" aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;display:none"></canvas>
<canvas id="c" aria-label="Juego de helicópteros de juguete en 3D"></canvas>
<div id="ov">
<h1 id="ti">ARMY MEN<span>Ataque aéreo 3D</span></h1>
<p id="tx">Arrastra para desplazarte en la dirección de la pantalla. Al soltar, el helicóptero se mantiene en posición. Mantén Fuego para disparar y lanza misiles al objetivo. Destruye las bases beige. En teclado: WASD o flechas, Espacio para disparar, M para misil y P para pausar.</p>
<button id="go">Despegar</button>
</div>
<div id="hud"><span id="renderMode" aria-live="polite"></span><button id="pause" aria-label="Pausar partida">Pausa</button><button id="sound" aria-pressed="false">Silenciar</button><div id="arm"><i id="ai"></i></div><div id="cmp">▲</div><div id="inf"></div><div id="dg"></div><button class="b" id="mi">Misil</button><button class="b" id="fu">Fuego</button></div>
</div>
<script src="toy-renderer.js?v=stage3-1"></script>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),R=(a,b)=>a+Math.random()*(b-a);
/* audio y vibración */
let AC=null,hum=null,sil=null,muted=false;
function silentSrc(){const n=4000,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return 'data:audio/wav;base64,'+btoa(s)}
function audio(){
  if(muted)return;
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0)}catch(e){}}
  if(AC&&AC.state!=='running'){try{AC.resume().catch(()=>{})}catch(e){}}
  if(sil&&sil.paused)sil.play().catch(()=>{});
  if(!sil){try{sil=new Audio(silentSrc());sil.loop=true;const p=sil.play();if(p)p.catch(()=>{})}catch(e){}}
}
function tone(f,f2,d,type,v){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}
function noise(d,v,fc){if(!AC||muted)return;const n=AC.currentTime,len=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,len,AC.sampleRate),a=buf.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=buf;fl.type='lowpass';fl.frequency.value=fc;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(n)}
function buzz(p){if(navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}
const sfx={shot(){tone(900,500,.07,'square',.06)},boom(){noise(.45,.7,1500);tone(180,50,.35,'sawtooth',.25)},hurt(){tone(300,90,.3,'square',.25);noise(.25,.5,1500)},pick(){tone(520,520,.08,'triangle',.25);setTimeout(()=>tone(780,780,.12,'triangle',.25),80)},miss(){noise(.5,.4,2500);tone(200,700,.4,'sawtooth',.15)},over(){tone(400,80,.9,'sawtooth',.25)}};
function humOn(){if(!AC||hum||muted)return;const o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=110;f.type='lowpass';f.frequency.value=700;g.gain.value=.08;l.frequency.value=13;lg.gain.value=.06;l.connect(lg);lg.connect(g.gain);o.connect(f);f.connect(g);g.connect(AC.destination);o.start();l.start();hum={o,l}}
function humOff(){if(!hum)return;try{hum.o.stop();hum.l.stop()}catch(e){}hum=null}
function clearInput(){for(const key in keys)delete keys[key];fire=false;mAsk=false;drag=null}
function pauseGame(){if(st!=='play')return;clearInput();st='paused';humOff();if(sil)sil.pause();if(AC)AC.suspend().catch(()=>{});show('Partida en pausa','Tu misión continuará desde el mismo punto.','Continuar')}
function resumeGame(){clearInput();st='play';audio();humOn();$('ov').style.display='none';$('hud').style.display='block'}
addEventListener('blur',pauseGame);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
/* cámara y proyección 3D (canvas 2D, sin WebGL) */
const cv=$('c'),ctx=cv.getContext('2d'),cam={x:0,z:0,yaw:Math.PI/5},PITCH=Math.PI/3,SCALE_WIDTH=105;
let W=360,H=640,HY=256,F=380;
function rs(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;W=r.width;H=r.height;ctx.setTransform(d,0,0,d,0,0);F=Math.min(W/SCALE_WIDTH,H/120)}
addEventListener('resize',rs);rs();
let renderer3d=null;
function renderStatus(active){$('renderMode').textContent=active?'3D · Plástico':'2D · 3D no disponible';}
renderStatus(false);
try{if(typeof ToyRenderer!=='undefined')renderer3d=new ToyRenderer($('world3d'),()=>{pauseGame();$('world3d').style.display='none';$('c').style.opacity='1';renderStatus(false)},()=>{renderStatus(true)});}catch(error){console.warn('Modo 2D: no se pudo iniciar WebGL.',error)}
if(renderer3d)renderStatus(true);

// Orthographic camera: fixed diagonal heading and 60-degree downward pitch.
function cs(x,y,z){const dx=x-cam.x,dz=z-cam.z,s=Math.sin(cam.yaw),c=Math.cos(cam.yaw),forward=dx*s+dz*c;return[-dx*c+dz*s,y*Math.cos(PITCH)+forward*Math.sin(PITCH),300+forward*Math.cos(PITCH)-y*Math.sin(PITCH)]}
function pj(a){return[W/2+a[0]*F,HY-a[1]*F,F,a[2]]}
function headingAngle(yaw){const dx=Math.sin(yaw),dz=Math.cos(yaw),right=-dx*Math.cos(cam.yaw)+dz*Math.sin(cam.yaw),down=-(dx*Math.sin(cam.yaw)+dz*Math.cos(cam.yaw))*Math.sin(PITCH);return Math.atan2(-right,down)}
function P3(x,y,z){const a=cs(x,y,z);return a[2]<1?null:pj(a)}
function clip(a,b){if(a[2]<1&&b[2]<1)return null;if(a[2]<1){const t=(1-a[2])/(b[2]-a[2]);a=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,1]}else if(b[2]<1){const t=(1-b[2])/(a[2]-b[2]);b=[b[0]+(a[0]-b[0])*t,b[1]+(a[1]-b[1])*t,1]}return[a,b]}
const ell=(x,y,rx,ry,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,Math.max(.5,rx),Math.max(.5,ry),0,0,6.3);ctx.fill()};
const rc=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
const tri=(a,b,c,d,e,f,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.fill()};
/* estado */
let st='menu',P,E=[],BL=[],EB=[],MS=[],FX=[],PK=[],DC=[],mis=1,t=0,rot=0,fire=false,mAsk=false,shk=0,bd=0,tb=0,hs=3,drag=null;
const keys={};
for(let i=0;i<70;i++){const x=R(-185,185),z=R(-185,185);if(Math.hypot(x,z)<20)continue;DC.push(i%2?{t:'t',x,z}:{t:'b',x,z,s:R(3,7),c:['#d9473f','#3f7fd9','#e8c547'][i%3]})}
function mk(arr,x,y,z,vx,vy,vz,l){const o={x,y,z,vx,vy,vz,l};arr.push(o);return o}
function boom(x,y,z,s){FX.push({x,y,z,l:.5,s})}
function spawnE(k,x,z){E.push({k,x,y:k==='heli'?8:0,z,hp:{heli:4,tank:6,tur:5,base:10}[k],r:{heli:3,tank:3.5,tur:2.5,base:6}[k],cd:R(1,3),p:{heli:50,tank:30,tur:20,base:100}[k],fl:0})}
function start(n,full){
  clearInput();t=0;shk=0;mis=n;E=[];BL=[];EB=[];MS=[];FX=[];PK=[];
  if(full||!P)P={arm:10,mi:6,sc:0,cd:0,inv:0,gs:0,bank:0};else{P.arm=Math.min(10,P.arm+3);P.mi+=4}
  P.x=0;P.z=0;P.y=8;P.yaw=0;bd=0;tb=2+n;hs=3;
  const ring=(k,c,a,b)=>{for(let i=0;i<c;i++){const an=R(0,6.28),d=R(a,b);spawnE(k,Math.cos(an)*d,Math.sin(an)*d)}};
  ring('base',tb,70,160);ring('tank',2+n,45,170);ring('tur',3+n,45,170);
  cam.x=0;cam.z=0;cam.yaw=Math.PI/5;st='play';
}
function hit(e,d){e.hp-=d;e.fl=.08;if(e.hp<=0)kill(e)}
function kill(e){if(e.dead)return;e.dead=1;boom(e.x,e.y+1,e.z,e.k==='base'?9:e.k==='heli'?5:4);sfx.boom();buzz(30);P.sc+=e.p;if(e.k==='base')bd++;
  if(e.k!=='base'&&Math.random()<.25)PK.push({x:e.x,z:e.z,ty:Math.random()<.5?'a':'m'})}
function show(ti,tx,bt){$('ti').innerHTML=ti;$('tx').textContent=tx;$('go').textContent=bt;$('ov').style.display='flex';$('hud').style.display='none'}
function hurt(){if(P.inv>0)return;P.arm--;P.inv=.3;shk=.3;sfx.hurt();buzz(60);if(P.arm<=0){st='over';humOff();sfx.over();buzz(300);show('Misión fallida','Puntos: '+P.sc+'.','Reintentar')}}
/* entrada */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k))e.preventDefault();if(k==='p'&&!e.repeat){if(st==='play')pauseGame();else if(st==='paused')resumeGame();return}if(st!=='play')return;keys[k]=1;if((k==='m'||k==='shift')&&!e.repeat)mAsk=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{audio();if(st!=='play'||drag)return;humOn();drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){drag.x=e.clientX;drag.y=e.clientY}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(event,e=>{if(drag&&drag.id===e.pointerId)drag=null});
const fu=$('fu'),mi=$('mi');
fu.addEventListener('pointerdown',e=>{if(st!=='play')return;audio();fire=true;fu.setPointerCapture(e.pointerId)});
for(const ev of['pointerup','pointercancel','pointerleave'])fu.addEventListener(ev,()=>{fire=false});
mi.addEventListener('pointerdown',()=>{if(st!=='play')return;audio();mAsk=true});
$('pause').onclick=pauseGame;
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'Activar sonido':'Silenciar';$('sound').setAttribute('aria-pressed',String(muted));if(muted){humOff();if(sil)sil.pause();if(AC)AC.suspend().catch(()=>{})}else{if(sil)sil=null;audio();if(st==='play')humOn()}};
$('go').onclick=()=>{if(st==='paused'){resumeGame();return}audio();humOn();buzz(20);tone(300,700,.25,'triangle',.25);const nx=st==='win';start(nx?mis+1:1,!nx);$('ov').style.display='none';$('hud').style.display='block'};
/* actualización */
function upd(dt){
  t+=dt;shk=Math.max(0,shk-dt);P.cd-=dt;P.inv-=dt;
  let sx=0,sy=0;
  if(drag){sx=clamp((drag.x-drag.sx)/70,-1,1);sy=clamp(-(drag.y-drag.sy)/70,-1,1)}
  if(keys.arrowleft||keys.a)sx=-1;if(keys.arrowright||keys.d)sx=1;if(keys.arrowup||keys.w)sy=1;if(keys.arrowdown||keys.s)sy=-1;
  const magnitude=Math.min(1,Math.hypot(sx,sy));
  if(magnitude>.08){const length=Math.hypot(sx,sy),right=sx/length,up=sy/length;const vx=-right*Math.cos(cam.yaw)+up*Math.sin(cam.yaw),vz=right*Math.sin(cam.yaw)+up*Math.cos(cam.yaw);P.yaw=Math.atan2(vx,vz);P.x=clamp(P.x+vx*28*magnitude*dt,-190,190);P.z=clamp(P.z+vz*28*magnitude*dt,-190,190)}
  const fx=Math.sin(P.yaw),fz=Math.cos(P.yaw);P.y=8+Math.sin(t*3)*.3;P.bank=0;
  const follow=1-Math.exp(-6*dt);cam.x+=(P.x-cam.x)*follow;cam.z+=(P.z-cam.z)*follow;
  if((fire||keys[' '])&&P.cd<=0){P.cd=.09;const s=(P.gs=!P.gs)?1.2:-1.2;mk(BL,P.x-fz*s+fx*2,P.y-.3,P.z+fx*s+fz*2,fx*130,0,fz*130,1.1);sfx.shot()}
  if(mAsk){mAsk=false;if(P.mi>0){P.mi--;let tg=null,dm=130;for(const e of E){if(e.dead)continue;const dx=e.x-P.x,dz=e.z-P.z,d=Math.hypot(dx,dz);if(d<dm&&(dx*fx+dz*fz)>.5*d){dm=d;tg=e}}
    const o=mk(MS,P.x+fx*2,P.y-1,P.z+fz*2,fx*75,0,fz*75,3);o.tg=tg;sfx.miss()}}
  hs-=dt;if(hs<=0){hs=7;if(E.filter(e=>e.k==='heli'&&!e.dead).length<Math.min(1+mis,4)){const a=R(0,6.28);spawnE('heli',clamp(P.x+Math.sin(a)*110,-185,185),clamp(P.z+Math.cos(a)*110,-185,185))}}
  for(const e of E){if(e.dead)continue;e.fl=Math.max(0,e.fl-dt);const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz),a=Math.atan2(dx,dz);
    if(e.k==='heli'){const q=d>32?1:0;e.x+=(Math.sin(a)*18*q+Math.cos(a)*10*(1-q))*dt;e.z+=(Math.cos(a)*18*q-Math.sin(a)*10*(1-q))*dt;e.y=8+Math.sin(t*2+e.cd)*.4}
    else if(e.k==='tank'&&d>25&&d<150){e.x+=Math.sin(a)*6*dt;e.z+=Math.cos(a)*6*dt}
    const rg=e.k==='tur'?65:e.k==='tank'?75:e.k==='heli'?70:0;e.cd-=dt;
    if(rg&&d<rg&&e.cd<=0){e.cd=e.k==='heli'?1.1:2;const s2=42,a2=a+R(-.06,.06);mk(EB,e.x,e.y+2,e.z,Math.sin(a2)*s2,(8-(e.y+2))/Math.max(.3,d/s2),Math.cos(a2)*s2,4)}}
  for(const b of BL){b.l-=dt;b.x+=b.vx*dt;b.z+=b.vz*dt;
    for(const e of E){if(e.dead)continue;if(Math.hypot(e.x-b.x,e.z-b.z)<e.r+1){hit(e,1);b.l=0;break}}}
  for(const o of MS){o.l-=dt;
    if(o.tg&&!o.tg.dead){const c=Math.atan2(o.vx,o.vz);let q=Math.atan2(o.tg.x-o.x,o.tg.z-o.z)-c;q=Math.atan2(Math.sin(q),Math.cos(q));const n2=c+clamp(q,-3*dt,3*dt);o.vx=Math.sin(n2)*75;o.vz=Math.cos(n2)*75;o.y+=((o.tg.y+1)-o.y)*dt*1.5}
    o.x+=o.vx*dt;o.z+=o.vz*dt;let ex=o.l<=0;
    for(const e of E)if(!e.dead&&Math.hypot(e.x-o.x,e.z-o.z)<e.r+2)ex=true;
    if(ex){o.l=0;boom(o.x,o.y,o.z,6);sfx.boom();for(const e of E)if(!e.dead&&Math.hypot(e.x-o.x,e.z-o.z)<e.r+8)hit(e,6)}}
  for(const b of EB){b.l-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;if(Math.hypot(b.x-P.x,b.z-P.z)<3&&Math.abs(b.y-P.y)<3.5){hurt();b.l=0}}
  for(const q of PK)if(Math.hypot(q.x-P.x,q.z-P.z)<5){q.d=1;if(q.ty==='a')P.arm=Math.min(10,P.arm+3);else P.mi+=3;sfx.pick();buzz(20)}
  for(const o of FX)o.l-=dt;
  E=E.filter(e=>!e.dead);BL=BL.filter(b=>b.l>0);MS=MS.filter(o=>o.l>0);EB=EB.filter(b=>b.l>0);PK=PK.filter(q=>!q.d);FX=FX.filter(o=>o.l>0);
  if(st==='play'&&bd>=tb){st='win';humOff();show('Misión '+mis+' cumplida','Puntos: '+P.sc+'. Te reparamos y recargamos misiles.','Siguiente misión')}
  $('ai').style.width=P.arm*10+'%';$('inf').textContent='Misión '+mis+' · Bases '+bd+'/'+tb+' · '+P.sc;mi.textContent='Misil '+P.mi;
  let nbs=null,dm2=1e9;for(const e of E)if(e.k==='base'){const d=Math.hypot(e.x-P.x,e.z-P.z);if(d<dm2){dm2=d;nbs=e}}
  if(nbs)$('cmp').style.transform='rotate('+(Math.atan2(P3(nbs.x,0,nbs.z)[0]-W/2,HY-P3(nbs.x,0,nbs.z)[1])*180/Math.PI)+'deg)';
  if(t<6)$('dg').textContent='Audio: '+(AC?AC.state:'no disponible')+(sil&&!sil.paused?' · media activa':' · media inactiva');else $('dg').textContent='';
}
/* sprites */
function heli(p,col,dk,fl,back,bank){
 const s=p[2];ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(bank||0);
 // Tail, stabilizers and landing skids beneath the molded fuselage.
 rc(-.25*s,-4.6*s,.5*s,4*s,dk);rc(-1.5*s,-4.2*s,3*s,.3*s,col);
 ctx.strokeStyle=dk;ctx.lineWidth=Math.max(1,.22*s);
 for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(side*1.2*s,.4*s);ctx.lineTo(side*2*s,1.7*s);ctx.lineTo(side*2.5*s,1.7*s);ctx.stroke();rc(side*2*s-.15*s,.5*s,.3*s,1.7*s,dk)}
 const body=ctx.createLinearGradient(-2*s,-s,2*s,s);body.addColorStop(0,dk);body.addColorStop(.4,fl?'#fff':col);body.addColorStop(.55,fl?'#fff':col);body.addColorStop(.61,fl?'#fff':'#efffc799');body.addColorStop(.70,fl?'#fff':col);body.addColorStop(1,dk);
 ell(0,0,1.7*s,1.6*s,body);
 // Injection-mold seam and small screw recesses on the toy shell.
 ctx.strokeStyle=dk;ctx.lineWidth=Math.max(.6,.05*s);ctx.beginPath();ctx.ellipse(0,0,1.6*s,1.5*s,0,0,Math.PI*2);ctx.stroke();
 ell(-.7*s,-.6*s,.23*s,.45*s,'#ffffff55');
 for(const side of [-1,1]){ell(side*.85*s,.8*s,.13*s,.13*s,dk);rc(side*.85*s-.07*s,.78*s,.14*s,.04*s,col)}
 const glass=ctx.createLinearGradient(0,-s,0,s);glass.addColorStop(0,'#c5f2ed');glass.addColorStop(.45,'#4c8e9c');glass.addColorStop(1,'#193b4c');
 ell(0,back?-.5*s:.5*s,1.15*s,.72*s,glass);rc(-.08*s,-1.2*s,.16*s,1.8*s,dk);
 for(const side of [-1,1]){rc(side*1.7*s-.35*s,-.5*s,.7*s,1.5*s,dk);ell(side*1.7*s,.9*s,.25*s,.22*s,'#162c28')}
 rc(-.8*s,.9*s,1.6*s,.18*s,'#d8dfaa');
 ell(-1.8*s,0,.14*s,.14*s,'#f36950');ell(1.8*s,0,.14*s,.14*s,'#b7ffc1');
 ctx.globalAlpha=.14;ell(0,-1.8*s,5.6*s,.85*s,'#e7eed1');ctx.globalAlpha=1;
 ctx.strokeStyle='#213b2b';ctx.lineWidth=Math.max(1,.19*s);
 for(let i=0;i<2;i++){const a=rot+i*Math.PI/2;ctx.beginPath();ctx.moveTo(Math.cos(a)*5.5*s,-1.8*s+Math.sin(a)*.8*s);ctx.lineTo(-Math.cos(a)*5.5*s,-1.8*s-Math.sin(a)*.8*s);ctx.stroke()}
 ell(0,-1.8*s,.35*s,.25*s,'#c2c9a1');ctx.restore();
}
// Rounded molded parts: a solid team color with a narrow plastic highlight.
function plasticPart(x,y,w,h,col,shade){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,shade);g.addColorStop(.16,col);g.addColorStop(.23,'#fff4');g.addColorStop(.32,col);g.addColorStop(1,shade);
 ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(w,h)*.18);ctx.fill();ctx.strokeStyle=shade;ctx.lineWidth=Math.max(.6,Math.min(w,h)*.035);ctx.stroke();
}
function sprE(e,p){const s=p[2],x=p[0],y=p[1],f=e.fl>0,col=f?'#fff':'#d5b578',dk='#8b713f';
 if(e.k==='heli'){heli(p,col,dk,f,false,headingAngle(Math.atan2(P.x-e.x,P.z-e.z)));return}
 // Flat oval feet make the scenery read as pieces on a toy battlefield.
 ell(x,y+.25*s,(e.k==='base'?6.8:3.7)*s,.8*s,dk);
 ell(x,y,(e.k==='base'?6.8:3.7)*s,.7*s,col);
 if(e.k==='tank'){
  plasticPart(x-3*s,y-1.8*s,6*s,1.8*s,col,dk);
  for(const side of [-1,1]){plasticPart(x+side*2.4*s-.5*s,y-2*s,s,2*s,dk,'#66572e');for(let i=0;i<4;i++)rc(x+side*2.4*s-.4*s,y-1.8*s+i*.45*s,.8*s,.1*s,col)}
  plasticPart(x-1.5*s,y-3*s,3*s,1.4*s,col,dk);plasticPart(x-.3*s,y-4.4*s,.6*s,2.1*s,col,dk);
  ell(x,y-4.4*s,.3*s,.14*s,dk);ell(x+.8*s,y-2.6*s,.35*s,.2*s,'#ead39c');
 }else if(e.k==='tur'){
  plasticPart(x-1.7*s,y-2.2*s,3.4*s,2.2*s,col,dk);ell(x,y-2.3*s,1.8*s,.65*s,col);plasticPart(x-.3*s,y-4.1*s,.6*s,2*s,col,dk);
 }else{
  plasticPart(x-5*s,y-4.4*s,10*s,4.4*s,col,dk);
  tri(x-5.7*s,y-4*s,x+5.7*s,y-4*s,x,y-7*s,col);tri(x,y-7*s,x+5.7*s,y-4*s,x+.5*s,y-4*s,'#edcf92');
  plasticPart(x-1.1*s,y-2.8*s,2.2*s,2.8*s,dk,'#756031');
  for(const side of [-1,1]){rc(x+side*3.2*s-.7*s,y-3*s,1.4*s,1.2*s,dk);rc(x+side*3.2*s-.7*s,y-3*s,1.4*s,.15*s,'#f5deab')}
  rc(x+4*s,y-16*s,.35*s,12*s,dk);rc(x+4.35*s,y-16*s,2.6*s,1.5*s,'#cf5540');ell(x+4.18*s,y-16*s,.3*s,.3*s,col);
 }
}
/* dibujo */
function draw(){
  HY=H*.52+(shk>0?R(-2,2):0);
  if(renderer3d&&renderer3d.render({W,H,F,HY,cam,PITCH,P,E,DC,BL,EB,MS,FX,PK,rot,t})){$('world3d').style.display='block';$('c').style.opacity='0';return}

  HY=H*.52+(shk>0?R(-2,2):0);
  ctx.fillStyle='#607c49';ctx.fillRect(0,0,W,H);
  ctx.beginPath();for(let k=-10;k<=10;k++){const v=k*20;for(const q of[[v,-200,v,200],[-200,v,200,v]]){const c=clip(cs(q[0],0,q[1]),cs(q[2],0,q[3]));if(c){const a=pj(c[0]),b=pj(c[1]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}}}
  ctx.strokeStyle='rgba(205,216,148,.09)';ctx.lineWidth=1;ctx.stroke();
  for(const w of[[-200,-200,200,-200],[-200,200,200,200],[-200,-200,-200,200],[200,-200,200,200]]){const c=clip(cs(w[0],0,w[1]),cs(w[2],0,w[3]));if(c){const a=pj(c[0]),b=pj(c[1]),a2=pj(cs(w[0],5,w[1])),b2=pj(cs(w[2],5,w[3]));ctx.fillStyle='#9b6b3a';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(b2[0],b2[1]);ctx.lineTo(a2[0],a2[1]);ctx.fill()}}
  const sh=(x,z)=>{const p=P3(x,0,z);if(p)ell(p[0],p[1],2.2*p[2],.7*p[2],'rgba(0,0,0,.22)')};
  for(const e of E)if(e.k==='heli')sh(e.x,e.z);if(P)sh(P.x,P.z);
  const L=[],add=(x,y,z,fn)=>{const a=cs(x,y,z);if(Math.hypot(x-cam.x,z-cam.z)>180)return;const p=pj(a);if(p[0]<-150||p[0]>W+150)return;L.push([a[2],p,fn])};
  for(const d of DC)add(d.x,0,d.z,p=>{const s=p[2],x=p[0],y=p[1];if(d.t==='t'){ell(x,y,3.5*s,.65*s,'#25542c');ell(x,y-.15*s,3.5*s,.55*s,'#438344');rc(x-.5*s,y-4*s,s,4*s,'#7a5230');tri(x-3.6*s,y-3*s,x+3.6*s,y-3*s,x,y-9*s,'#234e38');tri(x-2.8*s,y-5*s,x+2.8*s,y-5*s,x,y-11*s,'#376b45');tri(x-.4*s,y-10*s,x+2.8*s,y-5*s,x+.3*s,y-5*s,'#6d8c50')}else{plasticPart(x-d.s*s/2,y-d.s*s,d.s*s,d.s*s,d.c,'#354c42');for(const side of [-1,1])ell(x+side*d.s*s*.23,y-d.s*s*1.04,d.s*s*.14,d.s*s*.07,d.c);rc(x-d.s*s/2,y-d.s*s*1.2,d.s*s,d.s*s*.2,'rgba(255,255,255,.35)')}});
  for(const e of E)add(e.x,e.y,e.z,p=>sprE(e,p));
  for(const q of PK)add(q.x,1.5,q.z,p=>rc(p[0]-.9*p[2],p[1]-.9*p[2],1.8*p[2],1.8*p[2],q.ty==='a'?'#3fbf4a':'#d9473f'));
  for(const b of BL)add(b.x,b.y,b.z,p=>{const q=P3(b.x-b.vx*.04,b.y,b.z-b.vz*.04);ctx.strokeStyle='#ffe066';ctx.lineWidth=Math.max(1.5,p[2]*.3);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q?q[0]:p[0],q?q[1]:p[1]);ctx.stroke()});
  for(const o of MS)add(o.x,o.y,o.z,p=>ell(p[0],p[1],Math.max(2,.7*p[2]),Math.max(2,.7*p[2]),'#ff5a2e'));
  for(const b of EB)add(b.x,b.y,b.z,p=>ell(p[0],p[1],Math.max(2,.5*p[2]),Math.max(2,.5*p[2]),'#ff9a2e'));
  for(const o of FX)add(o.x,o.y,o.z,p=>{const k=1-o.l/.5;ctx.globalAlpha=Math.max(0,.9*(1-k));ell(p[0],p[1],o.s*(.3+k)*p[2],o.s*(.3+k)*p[2],k>.5?'#525c50':'#ef8242');ell(p[0],p[1],o.s*(1-k)*p[2]*.6,o.s*(1-k)*p[2]*.6,'#ffe9a2');for(let i=0;i<7;i++){const a=i*6.28/7;ell(p[0]+Math.cos(a)*k*o.s*p[2]*1.7,p[1]+Math.sin(a)*k*o.s*p[2]*1.7,Math.max(.5,(1-k)*p[2]*.3),Math.max(.5,(1-k)*p[2]*.3),'#ffd78a')}ctx.globalAlpha=1});
  if(P&&!(P.inv>0&&Math.floor(t*20)%2))add(P.x,P.y,P.z,p=>heli(p,'#50a43b','#245c26',false,true,headingAngle(P.yaw)));
  L.sort((a,b)=>b[0]-a[0]);for(const q of L)q[2](q[1]);
}
let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1e3);last=n;rot+=dt*30;
  if(st==='play')upd(dt);else if(st!=='paused'){cam.x=Math.sin(n/12000)*20;cam.z=Math.cos(n/12000)*20}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
